  authErr:{background:"#FCECEA",color:"#C0392B",fontSize:12.5,fontWeight:500,padding:"8px 11px",borderRadius:8,marginTop:12},
  authHint:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#8A8F9E",marginTop:16,marginBottom:0,lineHeight:1.5},
};

// ---------- Tela de conexão + carregamento da nuvem ----------
function Root(){
  const [fase,setFase]=useState(TOKEN ? "carregando" : "login"); // login | carregando | pronto | erro
  const [inicial,setInicial]=useState(null);
  const [conectado,setConectado]=useState("");
  const [usuario,setUsuario]=useState(""); const [senha,setSenha]=useState("");
  const [erro,setErro]=useState(""); const [ocupado,setOcupado]=useState(false);
  const refU=useRef(); const refS=useRef();

  async function carregarTudo(){
    setFase("carregando"); setErro("");
    try{
      const perfil=await apiCall("perfil");     // quem está conectado (login do servidor)
      const quem=perfil.user||"";
      setConectado(quem);
      let dados=await store.carregar();
      const primeiraVez=!dados;
      if(!dados){ dados=seed(); }                 // primeira vez: cria os dados iniciais
      // Já deixa a sessão apontando para o usuário conectado (evita tela intermediária/branco)
      dados=prepararDados(dados, quem);
      if(primeiraVez){
        await store.salvar(dados);
      }
      // Sempre que um MASTER entra, garante um login de conexão para cada pessoa do app.
      // (barato: uma consulta; cria só os que faltam; senha inicial 1234, troca no 1º acesso)
      if(perfil && perfil.master){
        try{
          const lista=await apiCall("listarUsuarios");
          const existentes=new Set((lista.usuarios||[]).map((x)=>String(x.usuario).toLowerCase()));
          for(const u of dados.users){
            if(u.username==="admin") continue;
            if(existentes.has(u.username.toLowerCase())) continue;
            try{ await apiCall("cadastrarUsuario",{ user:u.username, senha:"1234", master:u.role==="master" }); }catch(e){}
          }
        }catch(e){ /* ignora — tenta de novo na próxima entrada do master */ }
      }
      setInicial(dados); setFase("pronto");
    }catch(e){
      if(String(e.message||"").includes("Sessão")){ setToken(null); setFase("login"); setErro("Sua sessão expirou. Entre novamente."); return; }
      setErro(e.message||"Falha ao carregar."); setFase("erro");
    }
  }

  useEffect(()=>{ if(TOKEN) carregarTudo(); },[]);

  const entrar=async (e)=>{
    if(e&&e.preventDefault)e.preventDefault();
    const u=(usuario||(refU.current&&refU.current.value)||"").trim();
    const s=senha||(refS.current&&refS.current.value)||"";
    if(!u||!s){ setErro("Informe usuário e senha."); return; }
    setOcupado(true); setErro("");
    try{
      const j=await apiCall("login",{ user:u, senha:s });
      setToken(j.token);
      await carregarTudo();
    }catch(err){ setErro(err.message||"Não foi possível entrar."); }
    setOcupado(false);
  };

  const sair=()=>{ setToken(null); setInicial(null); setFase("login"); setUsuario(""); setSenha(""); };

  if(fase==="pronto") return <App inicial={inicial} aoSair={sair} usuarioConectado={conectado}/>;

  if(fase==="carregando") return (
    <div style={S.authWrap}><div style={{textAlign:"center"}}>
      <div className="spin" style={{margin:"0 auto 14px"}}/>
      <div style={{color:"#5A6072",fontFamily:FONT}}>Carregando os dados da equipe…</div>
    </div></div>);

  // login de conexão (mesmo do servidor)
  return (
    <div style={S.authWrap}>
      <form onSubmit={entrar} style={{background:"#fff",borderRadius:16,padding:26,width:"min(94vw,380px)",boxShadow:"0 20px 50px rgba(20,22,31,.22)",fontFamily:FONT}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style={S.brandMark}>◆</div>
          <div><div style={{fontWeight:700,fontSize:15}}>Equipe</div><div style={{fontSize:11.5,color:"#8A8F9E"}}>gestão de trabalho</div></div>
        </div>
        <label style={{fontSize:12,fontWeight:700,color:"#5A6072",display:"block",marginBottom:4}}>Usuário</label>
        <input ref={refU} style={S.authInput} autoFocus autoComplete="username" value={usuario} onChange={(e)=>setUsuario(e.target.value)} placeholder="seu login"/>
        <label style={{fontSize:12,fontWeight:700,color:"#5A6072",display:"block",margin:"12px 0 4px"}}>Senha</label>
        <input ref={refS} style={S.authInput} type="password" autoComplete="current-password" value={senha} onChange={(e)=>setSenha(e.target.value)} placeholder="sua senha"/>
        {erro && <div style={{background:"#FCEDEA",color:"#C0392B",borderRadius:8,padding:"8px 11px",fontSize:13,marginTop:10}}>{erro}</div>}
        {fase==="erro" && <button type="button" onClick={carregarTudo} style={{...S.authInput,cursor:"pointer",marginTop:10,fontWeight:700,color:"#3B3AC9",background:"#F7F8FE"}}>Tentar carregar de novo</button>}
        <button type="submit" disabled={ocupado} style={{width:"100%",border:"none",background:"#3B3AC9",color:"#fff",borderRadius:9,padding:12,fontSize:14,fontWeight:700,cursor:"pointer",marginTop:14,fontFamily:FONT}}>
          {ocupado?"Entrando…":"Entrar"}</button>
        <div style={{fontSize:11,color:"#A0A5B2",marginTop:12,textAlign:"center"}}>Primeiro acesso: admin / admin</div>
      </form>
    </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
<script>
(function(){
  function isSkippable(el){
    if(!el) return true;
    var tag = el.tagName;
    if(tag!=="INPUT" && tag!=="TEXTAREA") return true;
    var type = (el.type||"text").toLowerCase();
    var skipTypes = ["password","email","number","tel","url","search","date","time","datetime-local","month","week","color","file","checkbox","radio","range"];
    if(skipTypes.indexOf(type)!==-1) return true;
    var ac = (el.getAttribute("autocomplete")||"").toLowerCase();
    if(ac.indexOf("username")!==-1 || ac.indexOf("password")!==-1) return true;
    return false;
  }
  document.addEventListener("beforeinput", function(e){
    var el = e.target;
    if(isSkippable(el)) return;
    if((e.inputType==="insertText" || e.inputType==="insertFromPaste") && e.data){
      if(el.value===""  && el.selectionStart===0){
        var upper = e.data.charAt(0).toUpperCase() + e.data.slice(1);
        if(upper!==e.data){
          e.preventDefault();
          document.execCommand("insertText", false, upper);
        }
      }
    }
  }, true);
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
