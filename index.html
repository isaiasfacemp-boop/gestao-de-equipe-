// ---------- Tempo útil (só conta dentro do expediente) ----------
// Expediente: seg a sex, 8h-12h e 13h30-17h30. Fora disso (noite, almoço, fim de semana) não soma.
const JANELAS_EXPEDIENTE = [[8,0,12,0],[13,30,17,30]];
const msUteis = (inicioTs, fimTs)=>{
  if(!inicioTs || !fimTs || fimTs<=inicioTs) return 0;
  let total=0;
  const cursor=new Date(inicioTs); cursor.setHours(0,0,0,0);
  const fimDia=new Date(fimTs); fimDia.setHours(0,0,0,0);
  while(cursor.getTime()<=fimDia.getTime()){
    const diaSemana=cursor.getDay();
    if(diaSemana>=1 && diaSemana<=5){
      for(const [h1,m1,h2,m2] of JANELAS_EXPEDIENTE){
        const janIni=new Date(cursor); janIni.setHours(h1,m1,0,0);
        const janFim=new Date(cursor); janFim.setHours(h2,m2,0,0);
        const ini=Math.max(janIni.getTime(), inicioTs);
        const fim=Math.min(janFim.getTime(), fimTs);
        if(fim>ini) total+=(fim-ini);
      }
    }
    cursor.setDate(cursor.getDate()+1);
  }
  return total;
};
const proximoDiaUtilInicio = (ts)=>{

// ---------- Abrir a pasta pelo endereço ----------
function toFileUrl(path){
  if(!path) return "";
  const t=path.trim();
  if(/^(https?|file):\/\//i.test(t)) return t;
  const x=t.replace(/\\/g,"/");
  if(x.startsWith("//")) return "file:"+x;   // \\servidor\pasta
  return "file:///"+x;                       // C:/Obras/Cliente A
}
async function copyPath(path){
  try{ await navigator.clipboard.writeText(path); return true; }
  catch(e){ try{ window.prompt("Copie o caminho e cole no Explorador de Arquivos:",path); return true; }catch(_){ return false; } }
}
function openFolderPath(path){
  if(!path) return;
  const url=toFileUrl(path);
  const naWeb=/^https?:/i.test(url);

  // Link do OneDrive/Drive: abre sempre, sem bloqueio
  if(naWeb){ window.open(url,"_blank","noopener"); return; }

  // Caminho do PC ou da rede: navegação por link real (maior chance de abrir direto)
  try{
    const a=document.createElement("a");
    a.href=url; a.target="_blank"; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){}

  // Se o sistema está sendo servido por http(s), o navegador bloqueia caminhos locais
  if(location.protocol!=="file:"){
    setTimeout(async()=>{
      await copyPath(path);
      alert("Este navegador não abre pastas do computador quando o sistema é acessado por um endereço da web.\n\n"+
            "O caminho foi copiado — cole na barra do Explorador de Arquivos:\n\n"+path+"\n\n"+
            "Para abrir com um clique só, use um link do OneDrive/Drive ou abra este arquivo HTML direto no computador.");
    },350);
  }
}

// ---------- Foto 3x4 do membro ----------
function lerFoto3x4(file){
  return new Promise((res,rej)=>{
    if(!file || !/^image\//.test(file.type)) return rej(new Error("Escolha um arquivo de imagem."));
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const W=180,H=240;                    // proporção 3x4
        const c=document.createElement("canvas"); c.width=W; c.height=H;
        const ctx=c.getContext("2d");
        const alvo=W/H, rel=img.width/img.height;
        let sw,sh,sx,sy;
        if(rel>alvo){ sh=img.height; sw=sh*alvo; sx=(img.width-sw)/2; sy=0; }
        else { sw=img.width; sh=sw/alvo; sx=0; sy=(img.height-sh)/2; }
        ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
        res(c.toDataURL("image/jpeg",0.8));
      };
      img.onerror=()=>rej(new Error("Não foi possível ler a imagem."));
      img.src=r.result;
    };
    r.onerror=()=>rej(new Error("Não foi possível ler o arquivo."));
    r.readAsDataURL(file);
  });
}

// ---------- Anexo PDF (Protocolado: o que precisa ser refeito) ----------
const PDF_MAX_BYTES = 8*1024*1024; // 8MB
function lerPdf(file){
  return new Promise((res,rej)=>{
    if(!file || !/^application\/pdf$/.test(file.type)) return rej(new Error("Escolha um arquivo PDF."));
    if(file.size>PDF_MAX_BYTES) return rej(new Error("O PDF precisa ter até 8MB."));
    const r=new FileReader();
    r.onload=()=>res({ name:file.name, data:r.result, size:file.size, uploadedAt:Date.now() });
    r.onerror=()=>rej(new Error("Não foi possível ler o arquivo."));
    r.readAsDataURL(file);
  });
}

// ---------- Relatório PDF da equipe ----------
function gerarRelatorioEquipePdf(tasks, members, projects){
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({ orientation:"landscape" });
  const largura=doc.internal.pageSize.getWidth();
  const agora=new Date();
  const media=(arr)=> arr.length? arr.reduce((a,b)=>a+b,0)/arr.length : null;

  // Cabeçalho colorido
  doc.setFillColor(59,58,201); doc.rect(0,0,largura,24,"F");
  doc.setTextColor(255); doc.setFontSize(18); doc.text("Relatório da equipe", 14, 15);
  doc.setFontSize(9.5);
  doc.text(`Gerado em ${agora.toLocaleDateString("pt-BR")} às ${agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`, 14, 21);
  doc.setTextColor(0);

  const fluxo=tasks.filter((t)=>t.tipo!=="reuniao");
  const total=fluxo.length;
  const totalDone=tasks.filter((t)=>t.col==="done").length;
  const totalHours=tasks.reduce((a,t)=>a+tempoReal(t)/3600000,0);

  const colWidth=(largura-28-6)/2;
  // Resumo geral
  doc.autoTable({
    startY:32,
    head:[["Resumo geral",""]],
    body:[
      ["Tarefas concluídas", String(totalDone)],
      ["Horas de serviço (tempo real)", hms(totalHours)],
      ["Em revisão", String(tasks.filter((t)=>t.col==="review").length)],
      ["Em aberto (a fazer + em andamento + revisão)", String(tasks.filter((t)=>t.col!=="done").length)],
      ["Membros na equipe", String(members.length)],
      ["Projetos", String((projects||[]).length)],
    ],
    theme:"grid", styles:{fontSize:9.5}, headStyles:{fillColor:[59,58,201]},
    tableWidth:colWidth, margin:{left:14},
  });
  const finalYResumo=doc.lastAutoTable.finalY;

  // Indicadores do processo (equipe toda) — mesmas contas do Painel
  const emAberto=fluxo.filter((t)=>t.col==="todo").length;
  const pctAberto=total? Math.round((emAberto/total)*100) : 0;
  const comAceite=fluxo.filter((t)=>t.acceptedAt&&t.createdAt);
  const medAceite=media(comAceite.map((t)=>msUteis(t.createdAt,t.acceptedAt)));
  const comExecucao=fluxo.filter((t)=>t.acceptedAt&&(t.protocoladoAt||t.completedAt));
  const medExecucao=media(comExecucao.map((t)=>msUteis(t.acceptedAt,t.protocoladoAt||t.completedAt)));
  const retrabalho=fluxo.filter((t)=>(t.reworkCount||0)>0).length;
  const pctRetrabalho=total? Math.round((retrabalho/total)*100) : 0;
  const comProtocolo=fluxo.filter((t)=>t.protocoladoAt&&t.createdAt);
  const medProtocolo=media(comProtocolo.map((t)=>msUteis(t.createdAt,t.protocoladoAt)));
  const comConcluido=fluxo.filter((t)=>t.completedAt&&t.createdAt);
  const medConcluido=media(comConcluido.map((t)=>msUteis(t.createdAt,t.completedAt)));

  doc.autoTable({
    startY:32,
    head:[["Indicadores do processo",""]],
    body:[
      ["Em aberto (a fazer)", `${pctAberto}% (${emAberto} de ${total})`],
      ["Tempo médio para aceitar", medAceite!=null? durMs(medAceite) : "—"],
      ["Tempo médio de execução", medExecucao!=null? durMs(medExecucao) : "—"],
      ["Taxa de retrabalho", `${pctRetrabalho}% (${retrabalho} de ${total})`],
      ["Tempo médio até Protocolado", medProtocolo!=null? durMs(medProtocolo) : "—"],
      ["Tempo médio até Concluído", medConcluido!=null? durMs(medConcluido) : "—"],
    ],
    theme:"grid", styles:{fontSize:9.5}, headStyles:{fillColor:[139,58,191]},
    tableWidth:colWidth, margin:{left:14+colWidth+6},
  });

  // Indicadores por membro
  const porMembro=members.map((m)=>{
    const doMembro=fluxo.filter((t)=>t.assignee===m.id);
    const n=doMembro.length;
    const concluidas=doMembro.filter((t)=>t.col==="done").length;
    const ativas=doMembro.filter((t)=>t.col!=="done").length;
    const retrabM=doMembro.filter((t)=>(t.reworkCount||0)>0).length;
    const pctRetrM=n? Math.round((retrabM/n)*100) : 0;
    const aceiteM=media(doMembro.filter((t)=>t.acceptedAt&&t.createdAt).map((t)=>msUteis(t.createdAt,t.acceptedAt)));
    const execM=media(doMembro.filter((t)=>t.acceptedAt&&(t.protocoladoAt||t.completedAt)).map((t)=>msUteis(t.acceptedAt,t.protocoladoAt||t.completedAt)));
    const protM=media(doMembro.filter((t)=>t.protocoladoAt&&t.createdAt).map((t)=>msUteis(t.createdAt,t.protocoladoAt)));
    const horas=doMembro.reduce((a,t)=>a+tempoReal(t)/3600000,0);
    return [m.name, String(n), String(concluidas), String(ativas),
      aceiteM!=null? durMs(aceiteM) : "—", execM!=null? durMs(execM) : "—",
      `${pctRetrM}%`, protM!=null? durMs(protM) : "—", hms(horas)];
  });
  doc.autoTable({
    startY:Math.max(finalYResumo,doc.lastAutoTable.finalY)+10,
    head:[["Membro","Tarefas","Concluídas","Ativas","P/ aceitar","Execução","Retrabalho","Até Protocolado","Horas"]],
    body:porMembro,
    theme:"grid", styles:{fontSize:9}, headStyles:{fillColor:[59,58,201]}, margin:{left:14,right:14},
  });

  // Por projeto
  if(projects && projects.length){
    const porProjeto=projects.map((p)=>{
      const doProj=fluxo.filter((t)=>t.project===p.id);
      const abertas=doProj.filter((t)=>t.col!=="done").length;
      const concluidas=doProj.filter((t)=>t.col==="done").length;
      return [p.name, String(abertas), String(concluidas), String(doProj.length)];
    }).filter((r)=>Number(r[3])>0);
    if(porProjeto.length){
      doc.autoTable({
        startY:doc.lastAutoTable.finalY+10,
        head:[["Projeto","Em aberto","Concluídas","Total"]],
        body:porProjeto,
        theme:"grid", styles:{fontSize:9}, headStyles:{fillColor:[47,158,110]}, margin:{left:14,right:14},
      });
    }
  }

  // Rodapé com paginação
  const totalPaginas=doc.internal.getNumberOfPages();
  for(let i=1;i<=totalPaginas;i++){
    doc.setPage(i);
    doc.setFontSize(8); doc.setTextColor(150);
    doc.text(`Página ${i} de ${totalPaginas}`, largura-14, doc.internal.pageSize.getHeight()-8, {align:"right"});
    doc.setTextColor(0);
  }

  doc.save(`relatorio-equipe-${agora.toISOString().slice(0,10)}.pdf`);
}

// Guarda o token da sessão do servidor (obtido no login de conexão).
let TOKEN = null;
try { TOKEN = sessionStorage.getItem("ge-token") || null; } catch(e) {}
function setToken(t){ TOKEN = t; try{ if(t) sessionStorage.setItem("ge-token", t); else sessionStorage.removeItem("ge-token"); }catch(e){} }

async function apiCall(acao, extra){
  const r = await fetch("/api", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(Object.assign({ acao, token: TOKEN }, extra||{}))
  });
  const j = await r.json().catch(()=>({erro:"Resposta inválida do servidor."}));
  if(!r.ok) throw new Error(j.erro || "Erro no servidor.");
  return j;
}

// store agora fala com o banco: carregar/salvar do estado inteiro.
// Mantém uma cópia em memória para leituras rápidas; a nuvem é a fonte da verdade.
let MEM = null;
const store = {
  get(){ return MEM; },                 // usado só como fallback síncrono
  set(s){ MEM = s; },                   // a gravação real na nuvem é feita pelo App (debounce)
  async carregar(){ const j = await apiCall("carregar"); MEM = j.conteudo || null; return MEM; },
  async salvar(s){ MEM = s; await apiCall("salvar", { conteudo: s }); },
};

// Normaliza o estado carregado (migrações leves) e já aponta a sessão para o usuário conectado.
function prepararDados(saved, usuarioConectado){
  if(!saved) return seed();
  if(!saved.taskCatalog) saved.taskCatalog=[];
  if(!saved.messages) saved.messages=[];
  if(!saved.members) saved.members=[];
  if(!saved.users) saved.users=[];
  if(!saved.projects) saved.projects=[];
  if(!saved.session) saved.session={currentUserId:null};
  // dá login inicial aos membros sem conta (uma vez)
  if(!saved.loginsIniciais){
    const usados=new Set(saved.users.map((u)=>u.username.toLowerCase()));
    saved.members.forEach((m)=>{
      if(saved.users.some((u)=>u.memberId===m.id)) return;
      saved.users.push({ id:uid(), username:loginDoNome(m.name,usados), passHash:hashPw("1234"), role:"membro", memberId:m.id, mustChange:true });
    });
    saved.loginsIniciais=true;
  }
  saved.users.forEach((u)=>{ if(!u.memberId){
    const m={ id:uid(), name:u.username, color:AVATAR_COLORS[saved.members.length%AVATAR_COLORS.length] };
    saved.members.push(m); u.memberId=m.id; } });
  // aponta a sessão para o usuário conectado (casa pelo login, exatamente) — sem cair no master por engano
  const alvo=(usuarioConectado||"").toLowerCase();
  const u=saved.users.find((x)=>x.username.toLowerCase()===alvo);
  saved.session={ currentUserId: u ? u.id : null };
  return saved;
}

const TITULO_BASE = document.title;
function atualizarFavicon(comPonto){
  try{
    const link=document.querySelector('link[rel="icon"]');
    if(!link) return;
    if(!link.dataset.hrefOriginal) link.dataset.hrefOriginal=link.getAttribute("href")||"";
    const original=link.dataset.hrefOriginal;
    if(!comPonto){ if(original) link.setAttribute("href",original); return; }
    const desenharPonto=(ctx)=>{ ctx.beginPath(); ctx.arc(50,14,13,0,Math.PI*2); ctx.fillStyle="#D8442F"; ctx.fill();
      ctx.lineWidth=3; ctx.strokeStyle="#fff"; ctx.stroke(); };
    const c=document.createElement("canvas"); c.width=64; c.height=64; const ctx=c.getContext("2d");
    const img=new Image(); img.crossOrigin="anonymous";
    img.onload=()=>{ ctx.drawImage(img,0,0,64,64); desenharPonto(ctx); link.setAttribute("href",c.toDataURL("image/png")); };
    img.onerror=()=>{ ctx.fillStyle="#3B3AC9"; ctx.fillRect(0,0,64,64); desenharPonto(ctx); link.setAttribute("href",c.toDataURL("image/png")); };
    img.src=original;
  }catch(e){}
}
function atualizarNotificacao(total){
  try{ if("setAppBadge" in navigator){ if(total>0) navigator.setAppBadge(total); else navigator.clearAppBadge(); } }catch(e){}
  document.title = total>0 ? `(${total}) ${TITULO_BASE}` : TITULO_BASE;
  atualizarFavicon(total>0);
}

function App({ inicial, aoSair, usuarioConectado }){
  const [state,setState]=useState(()=> inicial || prepararDados(store.get(), usuarioConectado) );
  const [novidadeAberta,setNovidadeAberta]=useState(()=>{
    try{ return localStorage.getItem("ge-novidade-vista")!==NOVIDADE.versao; }catch(e){ return false; }
  });
  const fecharNovidade=()=>{ try{ localStorage.setItem("ge-novidade-vista",NOVIDADE.versao); }catch(e){} setNovidadeAberta(false); };
  const [query,setQuery]=useState("");
  const [showCatalog,setShowCatalog]=useState(false);
  const [folderFilter,setFolderFilter]=useState("");
  const [donePeriodo,setDonePeriodo]=useState("todos"); const [doneMembro,setDoneMembro]=useState("");
  const [showUsers,setShowUsers]=useState(false);
  const [showSwitch,setShowSwitch]=useState(false);
  const [showMsgs,setShowMsgs]=useState(false);
  const [membroTarefas,setMembroTarefas]=useState(null);
  const [gerandoPdf,setGerandoPdf]=useState(false);
  const [projAberto,setProjAberto]=useState(true);
  const [showNewProj,setShowNewProj]=useState(false);
  const [confirmarExcluir,setConfirmarExcluir]=useState(null);
  const [reuniaoMembro,setReuniaoMembro]=useState("");
  const [revisaoDe,setRevisaoDe]=useState(null);
  const [drag,setDrag]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  // Tarefas com uma edição aberta agora mesmo (título, notas, prazo, menu de prioridade/responsável) —
  // enquanto isso, a sincronização com a nuvem não mexe nelas, só nas outras.
  const editandoIdsRef=useRef(new Set());
  const marcarEdicao=(id,ativo)=>{ if(ativo) editandoIdsRef.current.add(id); else editandoIdsRef.current.delete(id); };
  // Salva o estado na nuvem com um pequeno atraso (debounce), para não gravar a cada tecla.
  const salvarRef=useRef(null); const primeiraRef=useRef(true);
  const salvandoRef=useRef(false);        // há um salvamento em andamento (rede)
  const mudouLocalRef=useRef(0);          // marca do último momento em que o usuário mexeu
  useEffect(()=>{
    store.set(state);
    if(primeiraRef.current){ primeiraRef.current=false; return; } // não salva logo ao carregar
    mudouLocalRef.current=Date.now();
    if(salvarRef.current) clearTimeout(salvarRef.current);
    salvarRef.current=setTimeout(()=>{
      salvandoRef.current=true;
      store.salvar(state).catch(()=>{}).finally(()=>{ salvarRef.current=null; salvandoRef.current=false; });
    }, 600);
    return ()=>{ if(salvarRef.current) clearTimeout(salvarRef.current); };
  },[state]);
  // Sincroniza: busca o estado da nuvem a cada 5s (todos veem as mudanças dos outros).
  useEffect(()=>{
    const i=setInterval(async ()=>{
      try{
        // não busca se há mudança local recente, salvamento pendente ou em andamento —
        // evita que uma leitura antiga da nuvem apague o que você acabou de fazer.
        if(salvarRef.current || salvandoRef.current) return;
        if(Date.now()-mudouLocalRef.current < 4000) return;
        const pedidoEm=Date.now();
        const nuvem=await store.carregar();
        // se o usuário mexeu enquanto a busca acontecia, descarta este resultado (está velho)
        if(mudouLocalRef.current > pedidoEm || salvarRef.current || salvandoRef.current) return;
        if(nuvem){
          setState((atual)=>{
            const ses=atual.session;
            // Tarefas que o usuário está editando agora ficam como estão localmente —
            // as outras tarefas atualizam normalmente com o que vem da nuvem.
            const idsTravados=editandoIdsRef.current;
            const tasksMescladas = idsTravados.size===0 ? nuvem.tasks
              : (nuvem.tasks||[]).map((t)=> idsTravados.has(t.id) ? ((atual.tasks||[]).find((x)=>x.id===t.id) || t) : t);
            const nuvemMesclada = {...nuvem, tasks:tasksMescladas};
            if(JSON.stringify({...nuvemMesclada,session:null})===JSON.stringify({...atual,session:null})) return atual;
            return {...nuvemMesclada, session:ses};
          });
        }
      }catch(e){}
    }, 5000);
    return ()=>clearInterval(i);
  },[]);
  const [tique,setTique]=useState(0);
  useEffect(()=>{ const i=setInterval(()=>setTique((n)=>n+1),30000); return ()=>clearInterval(i); },[]);
  useEffect(()=>{
    const agora=Date.now();
    const vencidas=(state.tasks||[]).filter((t)=>t.tipo==="reuniao" && t.col!=="done" && t.quando && new Date(t.quando).getTime()<=agora);
    if(vencidas.length===0) return;
    const ids=new Set(vencidas.map((t)=>t.id));
    patch((s)=>{
      const todosIds=(s.members||[]).map((m)=>m.id);
      // Quem é afetado por cada reunião que está começando agora: os convidados marcados,
      // ou todo mundo quando a reunião é para a equipe inteira (sem convidados específicos).
      const afetados=new Set();
      vencidas.forEach((r)=>{ const alvos=(r.convidados&&r.convidados.length)?r.convidados:todosIds; alvos.forEach((m)=>afetados.add(m)); });
      s.tasks=s.tasks.map((t)=>{
        if(ids.has(t.id)) return {...t,col:"done",completedAt:new Date(t.quando).getTime(),needsFix:false,fixNote:"",runningSince:null};
        // Pausa automaticamente a tarefa de quem está com o relógio rodando e entrou na reunião —
        // a pessoa está na reunião, não trabalhando na tarefa. O tempo já rodado fica guardado
        // e a tarefa fica "Pausada", esperando a pessoa retomar depois com "Continuar tarefa".
        if(t.tipo!=="reuniao" && t.runningSince && afetados.has(t.assignee)){
          const soma=(t.workedMs||0)+(agora-t.runningSince);
          const nota={ id:uid(), data:agora, texto:"Pausada automaticamente: início de reunião" };
          return {...t, workedMs:soma, runningSince:null, diario:[...(t.diario||[]),nota]};
        }
        return t;
      });
      return s;
    });
  },[state.tasks,tique]);
  useEffect(()=>{
    const cu=state.users.find((u)=>u.id===state.session.currentUserId);
    const mid=cu&&cu.memberId;
    const pendentesMsgs = mid ? (state.messages||[]).filter((m)=>m.paraMembro===mid && !m.lida).length : 0;
    const novasTarefas = mid ? (state.tasks||[]).filter((t)=>t.assignee===mid && t.col==="todo" && !(t.vistoPor||[]).includes(mid)).length : 0;
    atualizarNotificacao(pendentesMsgs+novasTarefas);
  },[state.messages, state.tasks, state.session, state.users]);
  const patch=(fn)=>setState((s)=>fn({...s}));

  const currentUser=state.users.find((u)=>u.id===state.session.currentUserId);

  const login=(id)=>patch((s)=>{ s.session={currentUserId:id}; return s; });
  const logout=()=>patch((s)=>{ s.session={currentUserId:null}; return s; });
  const changePassword=(pw)=>{
    patch((s)=>{ s.users=s.users.map((u)=>u.id===s.session.currentUserId?{...u,passHash:hashPw(pw),mustChange:false}:u); return s; });
    apiCall("trocarSenha",{ nova:pw }).catch(()=>{}); // atualiza a senha da tela de conexão
  };
  const addUser=(nome,username,password,role,noPainel,naEquipe)=>{
    const login=(username||"").trim().toLowerCase();
    // cria o login na tela de conexão (servidor). Se falhar, avisa e não cadastra local.
    return apiCall("cadastrarUsuario",{ user:login, senha:password, master: role==="master" })
      .then(()=>{
        patch((s)=>{
          const nomeLimpo=(nome||username).trim();
          let membro=s.members.find((m)=>m.name.toLowerCase()===nomeLimpo.toLowerCase());
          if(!membro){
            membro={ id:uid(), name:nomeLimpo, color:AVATAR_COLORS[s.members.length%AVATAR_COLORS.length], noPainel:noPainel!==false, naEquipe:naEquipe!==false };
            s.members=[...s.members,membro];
          }
          s.users=[...s.users,{ id:uid(), username:login, passHash:hashPw(password), role, memberId:membro.id, mustChange:true }];
          return s;
        });
      });
  };
  const removeUser=(id)=>{
    const alvo=state.users.find((u)=>u.id===id);
    patch((s)=>{ s.users=s.users.filter((u)=>u.id!==id); return s; });
    if(alvo) apiCall("excluirUsuario",{ user:alvo.username }).catch(()=>{});
  };
  const resetUserPassword=(id,pw)=>{
    const alvo=state.users.find((u)=>u.id===id);
    patch((s)=>{ s.users=s.users.map((u)=>u.id===id?{...u,passHash:hashPw(pw),mustChange:true}:u); return s; });
    if(alvo) apiCall("redefinirSenha",{ user:alvo.username, senha:pw }).catch(()=>{});
  };

  // Login unificado: quem entrou pela tela de conexão vira o usuário do app.
  // Casa pelo login (username), exatamente — nunca cai no master por engano/erro de digitação.
  if(!currentUser){
    const alvo=(usuarioConectado||"").toLowerCase();
    const u=state.users.find((x)=>x.username.toLowerCase()===alvo);
    if(u){ setTimeout(()=>login(u.id),0); return <div style={S.authWrap}><div className="spin"/></div>; }
    return <div style={S.authWrap}><div style={{textAlign:"center",maxWidth:320,fontFamily:FONT}}>
      <div style={{color:"#D8442F",fontWeight:700,marginBottom:6}}>Usuário ou senha inválidos</div>
      <div style={{color:"#5A6072",fontSize:13,marginBottom:16}}>Confira os dados e tente novamente.</div>
      <button style={{...S.primaryBtn,justifyContent:"center"}} onClick={()=>{ if(aoSair) aoSair(); }}>Tentar novamente</button>
    </div></div>;
  }
  if(currentUser.mustChange) return <div style={S.authWrap}><ChangePasswordCard forced onSave={changePassword}/></div>;

  const isMaster=currentUser.role==="master";
  const isPrivileged=currentUser.role==="master"||currentUser.role==="gerente";
  const myMemberId=currentUser.memberId;

  const MODO_REUNIOES="__reunioes__";
  const emReunioes = state.activeProject===MODO_REUNIOES;
  const project=state.projects.find((p)=>p.id===state.activeProject);
  const memberById=(id)=>state.members.find((m)=>m.id===id);
  const catalog=state.taskCatalog||[];
  const trabalhos=[...new Set(state.tasks.filter((t)=>t.project===state.activeProject&&t.folderName).map((t)=>t.folderName))].sort((a,b)=>a.localeCompare(b,"pt"));

  // visibilidade: master/gerente veem tudo; membro vê só as próprias
  const allProjTasks=emReunioes ? state.tasks.filter((t)=>t.tipo==="reuniao") : state.tasks.filter((t)=>t.project===state.activeProject);
  const podeVerReuniao=(t)=> !t.convidados || t.convidados.length===0 || (myMemberId && t.convidados.includes(myMemberId));
  const visibleTasks=isPrivileged?allProjTasks:allProjTasks.filter((t)=> t.tipo==="reuniao"
    ? podeVerReuniao(t)
    : (t.assignee&&t.assignee===myMemberId));
  let filtered=visibleTasks;
  if(emReunioes && reuniaoMembro) filtered=filtered.filter((t)=>{ const conf=t.confirmados||[]; return t.col==="done" ? conf.includes(reuniaoMembro) : !conf.includes(reuniaoMembro); });
  if(folderFilter) filtered=filtered.filter((t)=>t.folderName===folderFilter);
  if(query) filtered=filtered.filter((t)=>t.title.toLowerCase().includes(query.toLowerCase()));
  const resumoTarefas = isPrivileged ? state.tasks.filter((t)=>t.tipo!=="reuniao") : filtered;
  const todasMsgs=state.messages||[];
  const minhasMsgs=isMaster?todasMsgs:todasMsgs.filter((m)=>m.paraMembro===myMemberId||m.deMembro===myMemberId);
  const naoLidas=myMemberId?todasMsgs.filter((m)=>m.paraMembro===myMemberId&&!m.lida).length:0;
  const reviewCount=allProjTasks.filter((t)=>t.col==="review").length;

  const dentroDoPeriodo=(ts)=>{
    if(donePeriodo==="todos") return true;
    if(!ts) return false;
    const d=new Date(ts), hoje=new Date();
    if(donePeriodo==="dia") return mesmoDia(d,hoje);
    if(donePeriodo==="semana"){ const ini=inicioSemana(0); return d>=ini && d<somaDias(ini,7); }
    if(donePeriodo==="mes") return d.getMonth()===hoje.getMonth() && d.getFullYear()===hoje.getFullYear();
    return true;
  };
  const filtrarConcluidas=(lista)=> lista.filter((t)=> dentroDoPeriodo(t.completedAt) && (!doneMembro || t.assignee===doneMembro));

  // regras de edição — concluída (confirmada) fica travada para todos
  const isMine=(t)=> t.assignee && t.assignee===myMemberId;
  const ehReuniaoT=(t)=> t.tipo==="reuniao";
  const canEdit=(t)=> t.col!=="done" && (isPrivileged || (isMine(t) && !ehReuniaoT(t)));
  const canAct=(t)=> isPrivileged || (isMine(t) && !ehReuniaoT(t));
  const canDrag=(t)=> isPrivileged && t.col!=="done";

  const addProject=()=>setShowNewProj(true);
  const criarProjeto=(nome)=>{ const id=uid();
    patch((s)=>{s.projects=[...s.projects,{id,name:nome.trim()}];s.activeProject=id;return s;}); };
  const removeProject=(id)=>{ const proj=state.projects.find((p)=>p.id===id); setConfirmarExcluir(proj||{id}); };
  const excluirProjetoDeFato=(id)=>{
    patch((s)=>{s.projects=s.projects.filter((p)=>p.id!==id);s.tasks=s.tasks.filter((t)=>t.project!==id);if(s.activeProject===id)s.activeProject=s.projects[0]?.id??null;return s;});
    setConfirmarExcluir(null); };

  const confirmarReuniao=(taskId,membroId)=>{ if(!membroId)return;
    patch((s)=>{ s.tasks=s.tasks.map((t)=>{
      if(t.id!==taskId) return t;
      const jah=t.confirmados||[];
      return jah.includes(membroId)?t:{...t,confirmados:[...jah,membroId]};
    }); return s; }); };

  const enviarMensagem=(paraMembro,texto,grupoId)=>{ if(!paraMembro||!texto.trim())return;
    patch((s)=>{ s.messages=[...(s.messages||[]),{id:uid(),deUsuario:s.session.currentUserId,deMembro:myMemberId||null,paraMembro,texto:texto.trim(),em:Date.now(),lida:false,grupoId:grupoId||null}]; return s; }); };
  const marcarLidas=(memberId)=>patch((s)=>{ s.messages=(s.messages||[]).map((m)=>m.paraMembro===memberId?{...m,lida:true}:m); return s; });
  const apagarMensagem=(id)=>patch((s)=>{
    const alvo=(s.messages||[]).find((m)=>m.id===id); if(!alvo) return s;
    const podeApagarEsta = isMaster || (alvo.deMembro && alvo.deMembro===myMemberId);
    if(!podeApagarEsta) return s;
    // mensagem "para todos": apaga todas as cópias do mesmo envio de uma vez
    s.messages=(s.messages||[]).filter((m)=> alvo.grupoId ? m.grupoId!==alvo.grupoId : m.id!==id);
    return s; });

  const alternarPainel=(memberId)=>patch((s)=>{ s.members=s.members.map((m)=>m.id===memberId?{...m,noPainel:m.noPainel===false}:m); return s; });
  const alternarEquipe=(memberId)=>patch((s)=>{ s.members=s.members.map((m)=>m.id===memberId?{...m,naEquipe:m.naEquipe===false}:m); return s; });
  const renomearPessoa=(memberId,nome)=>{ if(!nome||!nome.trim())return;
    patch((s)=>{ s.members=s.members.map((m)=>m.id===memberId?{...m,name:nome.trim()}:m); return s; }); };
  const alterarLogin=(userId,username)=>{ if(!username||!username.trim())return;
    patch((s)=>{ s.users=s.users.map((u)=>u.id===userId?{...u,username:username.trim()}:u); return s; }); };
  const alterarAcesso=(userId,role)=>patch((s)=>{ s.users=s.users.map((u)=>u.id===userId?{...u,role}:u); return s; });
  const removerPessoa=(memberId)=>patch((s)=>{
    s.members=s.members.filter((m)=>m.id!==memberId);
    s.users=s.users.filter((u)=>u.memberId!==memberId);
    s.tasks=s.tasks.map((t)=>t.assignee===memberId?{...t,assignee:null}:t);
    s.messages=(s.messages||[]).filter((m)=>m.paraMembro!==memberId && m.deMembro!==memberId);
    return s; });

  const setMemberPhoto=(id,foto)=>patch((s)=>{ s.members=s.members.map((m)=>m.id===id?{...m,photo:foto||null}:m); return s; });

  const addCatalogItem=(title,desc)=>patch((s)=>{ s.taskCatalog=[...(s.taskCatalog||[]),{id:uid(),title:title.trim(),desc:(desc||"").trim()}]; return s; });
  const removeCatalogItem=(id)=>patch((s)=>{ s.taskCatalog=(s.taskCatalog||[]).filter((c)=>c.id!==id); return s; });
  const editCatalogItem=(id,title,desc)=>patch((s)=>{ s.taskCatalog=(s.taskCatalog||[]).map((c)=>c.id===id?{...c,title:title.trim(),desc:(desc||"").trim()}:c); return s; });

  // lançamento sempre na coluna "A fazer", a partir do catálogo
  const launchMany=({itens,assignee,desc,contarAgora})=>{
    patch((s)=>{
      const agora=Date.now();
      const inicioContagem = contarAgora===false ? proximoDiaUtilInicio(agora) : agora;
      const novas=(itens||[]).map((it)=>{
        const item=(s.taskCatalog||[]).find((c)=>c.id===it.catalogId); if(!item) return null;
        return { id:uid(), project:s.activeProject, col:"todo", title:item.title,
          tipo:it.reuniao?"reuniao":"tarefa", quando:it.quando||"", confirmados:[],
          convidados:it.reuniao?(it.convidados&&it.convidados.length?it.convidados:[]):[],
          priority:it.priority||"media", hours:Math.max(0,+it.hours||0), assignee:it.reuniao?null:(assignee||null),
          createdAt:inicioContagem, acceptedAt:null, workedMs:0, runningSince:null,
          desc:((desc&&desc.trim())||item.desc||"").trim(),
          needsFix:false, fixNote:"", completedAt:null, reworkCount:0, protocoladoAt:null };
      }).filter(Boolean);
      s.tasks=[...s.tasks,...novas];
      return s;
    });
  };
  const updateTask=(id,fields)=>patch((s)=>{s.tasks=s.tasks.map((t)=>t.id===id?{...t,...fields}:t);return s;});
  const removeTask=(id)=>patch((s)=>{s.tasks=s.tasks.filter((t)=>t.id!==id);return s;});
  const moveTask=(id,col)=>{ if(col==="done")return; updateTask(id,{col,completedAt:null}); };

  // fluxo: A fazer -> (aceitar) Em andamento -> (concluir) Concluído -> (master) Revisão -> (concluir) Concluído
  // Ao aceitar uma tarefa nova, qualquer outra tarefa do mesmo membro que esteja com o relógio rodando
  // é pausada automaticamente (o tempo já rodado fica guardado) — só volta a rodar quando o membro
  // abrir ela de novo, ficando "em pausa" até a mais recente ser concluída.
  const acceptTask=(id)=>{ const agora=Date.now();
    patch((s)=>{
      const alvo=s.tasks.find((x)=>x.id===id); if(!alvo) return s;
      const memberId=alvo.assignee;
      s.tasks=s.tasks.map((t)=>{
        if(t.id===id) return {...t, col:"doing", acceptedAt:t.acceptedAt??agora, runningSince:agora, completedAt:null};
        if(memberId && t.assignee===memberId && t.runningSince){
          const soma=(t.workedMs||0)+(agora-t.runningSince);
          return {...t, workedMs:soma, runningSince:null};
        }
        return t;
      });
      return s;
    });
  };
  // Retomar uma tarefa "Em andamento" que ficou pausada (porque outra foi aceita depois).
  // Também pausa qualquer outra tarefa do mesmo membro que esteja rodando no momento.
  const resumeTask=(id)=>{ const agora=Date.now();
    patch((s)=>{
      const alvo=s.tasks.find((x)=>x.id===id); if(!alvo) return s;
      const memberId=alvo.assignee;
      s.tasks=s.tasks.map((t)=>{
        if(t.id===id) return {...t, runningSince:agora};
        if(memberId && t.assignee===memberId && t.runningSince){
          const soma=(t.workedMs||0)+(agora-t.runningSince);
          return {...t, workedMs:soma, runningSince:null};
        }
        return t;
      });
      return s;
    });
  };
  // Pausar manualmente uma tarefa "Em andamento" a qualquer momento (emergência, imprevisto etc.).
  // Só para o cronômetro e guarda o tempo já trabalhado — a tarefa continua "Em andamento",
  // esperando a pessoa retomar depois com "Continuar tarefa".
  const pauseTask=(id)=>{ const t=state.tasks.find((x)=>x.id===id); if(!t||!t.runningSince) return;
    const agora=Date.now(); const soma=(t.workedMs||0)+(agora-t.runningSince);
    updateTask(id,{workedMs:soma,runningSince:null}); };
  const completeTask=(id)=>{ const t=state.tasks.find((x)=>x.id===id); const agora=Date.now();
    const soma=(t.workedMs||0)+(t.runningSince?agora-t.runningSince:0);
    updateTask(id,{col:"done",needsFix:false,fixNote:"",workedMs:soma,runningSince:null,
      acceptedAt:t.acceptedAt??agora,completedAt:agora}); };
  // Reabrir uma reunião já concluída (só o Master): volta para "A fazer", mantendo quem já confirmou.
  const reabrirReuniao=(id)=>updateTask(id,{col:"todo",completedAt:null});
  const sendToReview=(id)=>setRevisaoDe(id);
  // Envio Em andamento -> Revisão (1ª revisão do trabalho): não conta como retrabalho.
  const confirmarRevisao=(id,note)=>{
    updateTask(id,{col:"review",needsFix:true,fixNote:(note||"").trim(),runningSince:Date.now(),completedAt:null});
    setRevisaoDe(null);
  };
  const backToDoing=(id)=>updateTask(id,{col:"doing",needsFix:false,fixNote:"",runningSince:Date.now(),completedAt:null});
  // Correção pronta na Revisão Interna vai para Protocolado (não direto ao Concluído).
  const toProtocolado=(id)=>{ const t=state.tasks.find((x)=>x.id===id); const agora=Date.now();
    const soma=(t.workedMs||0)+(t.runningSince?agora-t.runningSince:0);
    updateTask(id,{col:"protocolado",needsFix:false,fixNote:"",workedMs:soma,runningSince:null,completedAt:null,protocoladoAt:t.protocoladoAt??agora}); };
  // De Protocolado: pode voltar para a Revisão Interna...
  const backToReview=(id)=>{ const t=state.tasks.find((x)=>x.id===id);
    updateTask(id,{col:"review",needsFix:true,runningSince:Date.now(),completedAt:null,reworkCount:(t?.reworkCount||0)+1}); };
  // Em andamento -> Revisão Interna (envio normal, sem marcar "conserto")
  const doingToReview=(id)=>updateTask(id,{col:"review",needsFix:false,fixNote:"",runningSince:Date.now(),completedAt:null});
  // Protocolado -> Em andamento
  const protocoladoToDoing=(id)=>updateTask(id,{col:"doing",needsFix:false,fixNote:"",runningSince:Date.now(),completedAt:null});
  // Repassar a tarefa para um colega: congela o tempo trabalhado até aqui (fica no histórico
  // da pessoa que saiu) e zera o cronômetro para quem está entrando — sem misturar os tempos.
  const repassarTarefa=(id,novoMembroId)=>{
    const t=state.tasks.find((x)=>x.id===id); if(!t || t.assignee===novoMembroId) return;
    const agora=Date.now(); const rodando=!!t.runningSince;
    const meuTempo=(t.workedMs||0)+(rodando?agora-t.runningSince:0);
    const deNome=(memberById(t.assignee)||{}).name; const paraNome=(memberById(novoMembroId)||{}).name||"—";
    const nota={ id:uid(), data:agora, texto:`Repassada${deNome?` por ${deNome}`:""} para ${paraNome}${meuTempo>0?` · tempo até aqui: ${durMs(meuTempo)}`:""}` };
    updateTask(id,{
      assignee:novoMembroId,
      workLog:[...(t.workLog||[]),{memberId:t.assignee,ms:meuTempo,ate:agora}],
      workedMs:0, runningSince:rodando?agora:null,
      diario:[...(t.diario||[]),nota],
    });
  };

  const emAbertoProj=(pid)=>state.tasks.filter((t)=>t.project===pid && t.col!=="done" && (isPrivileged || (t.tipo==="reuniao"?podeVerReuniao(t):t.assignee===myMemberId))).length;
  const concluidoProj=(pid)=>state.tasks.filter((t)=>t.project===pid && t.col==="done" && (isPrivileged || (t.tipo==="reuniao"?podeVerReuniao(t):t.assignee===myMemberId))).length;
  const emAbertoMembro=(mid)=>state.tasks.filter((t)=>t.assignee===mid && t.col!=="done").length;
  const concluidoMembro=(mid)=>state.tasks.filter((t)=>t.assignee===mid && t.col==="done").length;

  const onDrop=(col)=>{
    if(drag){ const task=state.tasks.find((t)=>t.id===drag);
      if(task && canDrag(task)){
        if(col==="done"){ alert("Use o botão \"Concluir tarefa\" no cartão para mover para Concluído."); }
        else moveTask(drag,col);
      }
    }
    setDrag(null); setDragOver(null);
  };

  return (
    <div style={S.app}>
      <aside style={S.sidebar}>
        <div style={{flex:1,overflowY:"auto"}}>
          <div style={S.brand}><div style={S.brandMark}>◆</div>
            <div><div style={S.brandName}>Equipe</div><div style={S.brandSub}>gestão de trabalho</div></div></div>

          <div style={S.sideLabel}>
            <span style={{display:"inline-flex",alignItems:"center",gap:5,cursor:"pointer"}} onClick={()=>setProjAberto((v)=>!v)}>
              <Ic n="chev" s={13} c="#8A8F9E" style={{transform:projAberto?"none":"rotate(-90deg)",transition:"transform .15s"}}/>
              Projetos <span style={{color:"#B0B5C0",fontWeight:600}}>· {state.projects.length}</span>
            </span>
            {isPrivileged && <button style={S.iconBtn} onClick={addProject} title="Novo projeto"><Ic n="plus" s={15}/></button>}</div>
          {(()=>{ const totalReun=state.tasks.filter((t)=>t.tipo==="reuniao").length;
            const abertasReun=state.tasks.filter((t)=>t.tipo==="reuniao"&&t.col!=="done").length;
            const ativa=state.activeProject===MODO_REUNIOES;
            return (<div className="proj" style={{...S.projRow,marginBottom:6,...(ativa?S.projActiveReun:S.projReun)}} onClick={()=>patch((s)=>({...s,activeProject:MODO_REUNIOES}))}>
              <Ic n="users" s={15} c={ativa?"#6B3FBF":"#8A5FD6"} style={{flexShrink:0}}/>
              <span style={{...S.projName,fontWeight:700,color:ativa?"#6B3FBF":"#5A4B7A"}}>Reuniões</span>
              <span style={{...S.numAberto,color:"#6B3FBF",background:"#EFE9FB",...(abertasReun>0?{}:S.numZero)}} title="Reuniões a fazer">{abertasReun}</span>
            </div>); })()}
          {projAberto ? (<div style={{display:"flex",flexDirection:"column",gap:2}}>
            {state.projects.map((p)=>{ const active=p.id===state.activeProject;
              const aberto=emAbertoProj(p.id); const feito=concluidoProj(p.id);
              return (<div key={p.id} className="proj" style={{...S.projRow,...(active?S.projActive:{})}} onClick={()=>patch((s)=>({...s,activeProject:p.id}))}>
                <Ic n="folder" s={15} style={{opacity:active?1:0.55,flexShrink:0}}/>
                <span style={S.projName}>{p.name}</span>
                <span style={S.contadores}>
                  <span style={{...S.numAberto,...(aberto>0?{}:S.numZero)}} title="Em aberto (a fazer, em andamento, revisão)">{aberto}</span>
                  <span style={{...S.numFeito,...(feito>0?{}:S.numZero)}} title="Concluídas">{feito}</span>
                </span>
                {isPrivileged && <button className="proj-del" style={S.projDel} onClick={(e)=>{e.stopPropagation();removeProject(p.id);}}><Ic n="trash" s={13}/></button>}
              </div>); })}
          </div>) : (
            <div style={S.projRecolhido} onClick={()=>setProjAberto(true)}>
              {state.projects.length} projeto{state.projects.length===1?"":"s"} · toque para mostrar
            </div>)}
        </div>

        <div style={S.sideFooter}>
          {isPrivileged && (<div style={S.abasLat}>
            <button style={{...S.abaLat,...(state.view==="board"?S.abaLatOn:{})}} onClick={()=>patch((s)=>({...s,view:"board"}))}>
              <Ic n="grid" s={14} c={state.view==="board"?"#3B3AC9":"#5A6072"}/> Quadro</button>
            <button style={{...S.abaLat,...(state.view==="dash"?S.abaLatOn:{})}} onClick={()=>patch((s)=>({...s,view:"dash"}))}>
              <Ic n="bar" s={14} c={state.view==="dash"?"#3B3AC9":"#5A6072"}/> Painel</button>
          </div>)}
          {isPrivileged && (<button style={S.sideBtn} disabled={gerandoPdf} onClick={()=>{ setGerandoPdf(true); try{ gerarRelatorioEquipePdf(state.tasks, state.members, state.projects); }catch(e){ alert("Não foi possível gerar o PDF."); } finally{ setGerandoPdf(false); } }}>
            <Ic n="flag" s={15} c="#4A4F5E"/> {gerandoPdf?"Gerando…":"Relatório PDF"}</button>)}
          <button style={{...S.sideBtn,...(naoLidas>0?{borderColor:"#C7CBFF",background:"#F7F8FE"}:{})}} onClick={()=>{ setShowMsgs(true); if(myMemberId&&naoLidas>0) marcarLidas(myMemberId); }}>
            <Ic n="mail" s={15} c="#4A4F5E"/> {isMaster?"Mensagens":"Minhas mensagens"}
            {naoLidas>0 && <span style={S.badgeMsg}>{naoLidas}</span>}
          </button>
          {isMaster && <button style={S.sideBtn} onClick={()=>setShowCatalog(true)}><Ic n="list" s={15} c="#4A4F5E"/> Cadastrar tarefa</button>}
          {isMaster && <button style={S.sideBtn} onClick={()=>setShowUsers(true)}><Ic n="userplus" s={15} c="#4A4F5E"/> Cadastrar usuário</button>}
          <div style={S.userChip}>
            <span style={{...S.avatarSm,background:ROLES[currentUser.role].color}}>{initials(currentUser.username)}</span>
            <div style={{flex:1,minWidth:0}}>

// ---------- Auth ----------
function Login({ users, onLogin }){
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [err,setErr]=useState("");
  const refU=useRef(), refP=useRef();
  const showHint=users.some((x)=>x.username==="admin" && x.role==="master" && x.mustChange);
  const submit=(e)=>{
    if(e && e.preventDefault) e.preventDefault();
    // lê também do campo: o preenchimento automático do navegador não dispara onChange
    const usuario=(u || (refU.current&&refU.current.value) || "").trim();
    const senha=(p || (refP.current&&refP.current.value) || "");
    const user=users.find((x)=>x.username.toLowerCase()===usuario.toLowerCase());
    if(!user || user.passHash!==hashPw(senha)){ setErr("Usuário ou senha incorretos."); return; }
    setErr(""); onLogin(user.id);
  };
  return (<form style={S.authCard} onSubmit={submit}>
    <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:22}}>
      <div style={S.brandMark}>◆</div><div><div style={S.brandName}>Equipe</div><div style={S.brandSub}>gestão de trabalho</div></div></div>
    <h2 style={S.authTitle}>Entrar</h2>
    <label style={S.authLabel}>Usuário</label>
    <input ref={refU} style={S.authInput} value={u} onChange={(e)=>{setU(e.target.value);setErr("");}} placeholder="admin"
      autoFocus name="username" autoComplete="username" onKeyDown={(e)=>{ if(e.key==="Enter") submit(e); }}/>
    <label style={S.authLabel}>Senha</label>
    <input ref={refP} style={S.authInput} type="password" value={p} onChange={(e)=>{setP(e.target.value);setErr("");}} placeholder="••••••"
      name="password" autoComplete="current-password" onKeyDown={(e)=>{ if(e.key==="Enter") submit(e); }}/>
    {err && <div style={S.authErr}>{err}</div>}
    <button type="submit" style={{...S.primaryBtn,width:"100%",justifyContent:"center",marginTop:14,padding:"11px"}}>Entrar</button>
    {showHint && <p style={S.authHint}><Ic n="lock" s={12} c="#8A8F9E"/> Primeiro acesso: <b>admin</b> / <b>admin</b> — você trocará a senha ao entrar.</p>}
  </form>);
}

function ChangePasswordCard({ onSave, onCancel, forced, titulo, sub, salvarLabel }){
  const [p1,setP1]=useState(""); const [p2,setP2]=useState(""); const [err,setErr]=useState("");
  const r1=useRef(), r2=useRef();
  const submit=(e)=>{
    if(e && e.preventDefault) e.preventDefault();
    const a=(p1 || (r1.current&&r1.current.value) || "");
    const b=(p2 || (r2.current&&r2.current.value) || "");
    if(a.length<4){ setErr("A senha deve ter ao menos 4 caracteres."); return; }
    if(a!==b){ setErr("As senhas não coincidem."); return; }
    onSave(a);
  };
  return (<form style={S.authCard} onSubmit={submit}>
    <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:18}}>
      <div style={{...S.brandMark,background:"#0E8F9E",boxShadow:"none"}}><Ic n="key" s={17} c="#fff"/></div>
      <div><div style={S.brandName}>{titulo || (forced?"Defina sua senha":"Alterar senha")}</div>
        <div style={S.brandSub}>{sub || (forced?"Obrigatório no primeiro acesso":"Escolha uma nova senha")}</div></div></div>
    <label style={S.authLabel}>Nova senha</label>
    <input ref={r1} style={S.authInput} type="password" value={p1} onChange={(e)=>{setP1(e.target.value);setErr("");}} autoFocus
      name="new-password" autoComplete="new-password" onKeyDown={(e)=>{ if(e.key==="Enter") submit(e); }}/>
    <label style={S.authLabel}>Confirmar senha</label>
    <input ref={r2} style={S.authInput} type="password" value={p2} onChange={(e)=>{setP2(e.target.value);setErr("");}}
      name="confirm-password" autoComplete="new-password" onKeyDown={(e)=>{ if(e.key==="Enter") submit(e); }}/>
    {err && <div style={S.authErr}>{err}</div>}
    <div style={{display:"flex",gap:8,marginTop:14}}>
      <button type="submit" style={{...S.primaryBtn,flex:1,justifyContent:"center",padding:"11px"}}>{salvarLabel || "Salvar senha"}</button>
      {onCancel && <button type="button" style={S.ghostBtn} onClick={onCancel}>Cancelar</button>}
    </div>
  </form>);
}

// Menu flutuante: renderiza fora do card (via portal) para nunca ficar cortado
// nem forçar a barra de rolagem da coluna — abre pra cima se não couber embaixo.
function DropMenu({ pos, children }){
  if(!pos) return null;
  const vw=window.innerWidth, vh=window.innerHeight;
  const espacoAbaixo=vh-pos.bottom, espacoAcima=pos.top;
  const abrirPraCima = espacoAbaixo<220 && espacoAcima>espacoAbaixo;
  const maxH=Math.max(140,Math.min(320,(abrirPraCima?espacoAcima:espacoAbaixo)-16));
  const style={ position:"fixed", ...(abrirPraCima?{bottom:vh-pos.top+4}:{top:pos.bottom+4}),
    right:Math.max(8,vw-pos.right), background:"#fff", borderRadius:10, border:"1px solid #E2E5EC",
    boxShadow:"0 8px 28px rgba(20,22,31,.14)", padding:5, zIndex:200, minWidth:170, maxHeight:maxH, overflowY:"auto" };
  return ReactDOM.createPortal(<div data-dropmenu="1" style={style} onClick={(e)=>e.stopPropagation()}>{children}</div>, document.body);
}
